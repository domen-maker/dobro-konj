<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBRAZEC za namenitev dela dohodnine za donacije</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f3f4f6;color:#111}
.wrap{max-width:900px;margin:24px auto;background:#fff;padding:30px 34px;box-shadow:0 2px 14px #0002}
h1{text-align:center;font-size:20px;margin:0 0 6px}.sub{text-align:center;font-size:12px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
input{width:100%;padding:10px;border:1px solid #999;border-radius:3px;font-size:15px}
table{width:100%;border-collapse:collapse;margin:22px 0}td,th{border:1px solid #777;padding:9px;font-size:13px;text-align:left}
.sig-title{font-weight:700;margin-top:18px}canvas{width:100%;height:170px;border:1px solid #777;touch-action:none;background:white}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{padding:11px 18px;border:0;border-radius:4px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}.secondary{background:#ddd}.status{margin-top:12px;font-weight:700}
.note{font-size:12px;color:#555;margin-top:6px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:0;padding:20px}.full{grid-column:auto}}
@media print{body{background:#fff}.wrap{box-shadow:none;margin:0;max-width:none}.actions,.status,.note{display:none}}
</style>
</head>
<body>
<div class="wrap" id="paper">
<h1>OBRAZEC</h1>
<div class="sub">za namenitev dela dohodnine za donacije</div>

<div class="grid">
 <div class="full"><label>Ime in priimek</label><input id="name" autocomplete="name"></div>
 <div><label>Davčna številka</label><input id="tax" inputmode="numeric" maxlength="8"></div>
 <div></div>
 <div class="full"><label>Naselje, ulica in hišna številka</label><input id="address"></div>
 <div class="full"><label>Poštna številka in ime pošte</label><input id="post"></div>
 <div><label>V/Na (kraj)</label><input id="place" value="Ljubljana"></div>
 <div><label>Dne (datum)</label><input id="date" type="date"></div>
</div>

<table>
<tr><th>Ime oziroma naziv upravičenca</th><th>Davčna številka upravičenca</th><th>Odstotek (%)</th></tr>
<tr><td>Društvo za razvoj slovenskega konjeništva</td><td>66123615</td><td>1,0 %</td></tr>
</table>

<div class="sig-title">Podpis zavezanca</div>
<canvas id="sig"></canvas>
<div class="note">Podpišite se z miško, prstom ali pisalom.</div>

<div class="actions">
 <button class="secondary" id="clear" type="button">IZBRIŠI PODPIS</button>
 <button class="secondary" type="button" onclick="window.print()">NATISNI / SHRANI PDF</button>
 <button class="primary" id="submit" type="button">ODDAJ OBRAZEC</button>
</div>
<div class="status" id="status"></div>
</div>

<script>
const canvas=document.getElementById('sig'), ctx=canvas.getContext('2d');
let drawing=false, hasInk=false;
function resizeCanvas(){
 const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
 const snapshot=hasInk ? canvas.toDataURL() : null;
 canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
 if(snapshot){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=snapshot;}
}
resizeCanvas(); window.addEventListener('resize',resizeCanvas);
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{drawing=true;hasInk=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
canvas.addEventListener('pointerup',()=>drawing=false); canvas.addEventListener('pointercancel',()=>drawing=false);
document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false};

const now=new Date();
document.getElementById('date').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makePdfHtml(v, signature){
 return `<!doctype html><html><head><meta charset="utf-8"><style>
 @page{size:A4;margin:16mm}body{font-family:Arial,sans-serif;color:#111;font-size:12px}
 h1{text-align:center;font-size:17px;margin:0}.sub{text-align:center;margin:4px 0 20px}
 .row{margin:9px 0;border-bottom:1px solid #777;padding:5px 2px}.lbl{font-weight:bold}
 table{width:100%;border-collapse:collapse;margin:22px 0}td,th{border:1px solid #555;padding:8px;text-align:left}
 .sig{margin-top:24px}.sig img{width:280px;max-height:110px;object-fit:contain;object-position:left center}
 </style></head><body>
 <h1>OBRAZEC</h1><div class="sub">za namenitev dela dohodnine za donacije</div>
 <div class="row"><span class="lbl">Ime in priimek:</span> ${esc(v.name)}</div>
 <div class="row"><span class="lbl">Davčna številka:</span> ${esc(v.tax)}</div>
 <div class="row"><span class="lbl">Naslov:</span> ${esc(v.address)}</div>
 <div class="row"><span class="lbl">Pošta:</span> ${esc(v.post)}</div>
 <div class="row"><span class="lbl">Kraj:</span> ${esc(v.place)}</div>
 <div class="row"><span class="lbl">Datum:</span> ${esc(v.date)}</div>
 <table><tr><th>Ime oziroma naziv upravičenca</th><th>Davčna številka upravičenca</th><th>Odstotek</th></tr>
 <tr><td>Društvo za razvoj slovenskega konjeništva</td><td>66123615</td><td>1,0 odstotka</td></tr></table>
 <div class="sig"><b>Podpis zavezanca:</b><br><img src="${signature}"></div>
 </body></html>`;
}

document.getElementById('submit').onclick=async()=>{
 const status=document.getElementById('status'), btn=document.getElementById('submit');
 const v={name:name.value.trim(),tax:tax.value.trim(),address:address.value.trim(),post:post.value.trim(),place:place.value.trim(),date:date.value};
 if(!v.name||!v.tax||!v.address||!v.post||!v.place||!v.date){status.textContent='Izpolnite vsa obvezna polja.';return}
 if(!/^\d{8}$/.test(v.tax)){status.textContent='Davčna številka mora vsebovati 8 številk.';return}
 if(!hasInk){status.textContent='Manjka podpis.';return}
 btn.disabled=true; btn.textContent='ODDAJAM ...'; status.textContent='';
 try{
   const signature=canvas.toDataURL('image/png');
   const payload={...v,signature,pdfHtml:makePdfHtml(v,signature)};
   const r=await fetch('/.netlify/functions/oddaj-obrazec',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   const data=await r.json().catch(()=>({}));
   if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
   btn.textContent='ODDANO'; status.textContent='Obrazec je bil uspešno oddan. PDF s podpisom je bil poslan po e-pošti.';
 }catch(e){
   btn.disabled=false; btn.textContent='ODDAJ OBRAZEC'; status.textContent='NAPAKA PRI ODDAJI: '+e.message;
 }
};
</script>
</body></html>
